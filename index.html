<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jscripts | Roblox Script Directory</title>
  <link rel="icon" type="image/png" href="images/jscripts-logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050711;
      --bg-2: #090d1f;
      --panel: rgba(16, 22, 43, 0.72);
      --panel-strong: rgba(23, 31, 61, 0.88);
      --text: #f8fbff;
      --muted: #a8b5d8;
      --soft: #dce6ff;
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.2);
      --blue: #4ba3ff;
      --purple: #9b5cff;
      --cyan: #48ead0;
      --pink: #ff6ccf;
      --green: #70ffba;
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      --radius: 22px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 8%, rgba(75, 163, 255, 0.26), transparent 28rem),
        radial-gradient(circle at 84% 2%, rgba(155, 92, 255, 0.26), transparent 30rem),
        radial-gradient(circle at 50% 45%, rgba(72, 234, 208, 0.08), transparent 34rem),
        linear-gradient(180deg, #080b18 0%, var(--bg) 48%, #04050d 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }

    body::after {
      background:
        radial-gradient(circle at 24% 80%, rgba(255, 108, 207, 0.12), transparent 26rem),
        radial-gradient(circle at 92% 72%, rgba(72, 234, 208, 0.1), transparent 24rem);
      filter: blur(2px);
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button, input { font: inherit; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 7, 17, 0.78);
      backdrop-filter: blur(22px);
    }

    .nav {
      width: min(var(--max), calc(100% - 32px));
      min-height: 74px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 950;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: transparent;
      box-shadow: 0 18px 44px rgba(75, 163, 255, 0.24);
      overflow: hidden;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
    }

    .nav-link {
      border: 0;
      padding: 10px 15px;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-weight: 850;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
    }

    .menu-button {
      display: none;
      width: 46px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }

    .menu-button span {
      display: block;
      width: 18px;
      height: 2px;
      margin: 4px auto;
      border-radius: 2px;
      background: currentColor;
    }

    main {
      position: relative;
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    .view { display: none; animation: fadeUp 360ms ease both; }
    .view.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      min-height: calc(100vh - 74px);
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.82fr);
      align-items: center;
      gap: 44px;
      padding: 58px 0 70px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 950;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 22px currentColor;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      max-width: 800px;
      margin-bottom: 20px;
      font-size: clamp(3.25rem, 9vw, 7.2rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    h1 .gradient {
      background: linear-gradient(90deg, #fff, #dce7ff 35%, #82d9ff 70%, #c9b6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h2 {
      margin-bottom: 12px;
      font-size: clamp(1.9rem, 3vw, 2.7rem);
      letter-spacing: -0.045em;
    }

    .lead {
      max-width: 710px;
      color: var(--muted);
      font-size: 1.09rem;
      line-height: 1.75;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      max-width: 620px;
      margin: 30px 0 0;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.055);
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
      letter-spacing: -0.04em;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 750;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 0 19px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.065);
      font-weight: 900;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .button:hover, .card:hover, .social-card:hover, .preview-row:hover {
      transform: translateY(-3px);
    }

    .button.primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 18px 46px rgba(75, 163, 255, 0.28);
    }

    .button.ghost {
      background: rgba(255, 255, 255, 0.035);
    }

    .button.full { width: 100%; }

    .showcase {
      position: relative;
      border: 1px solid var(--line-strong);
      border-radius: 28px;
      padding: 20px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.045)),
        rgba(10, 14, 31, 0.72);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .showcase::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -54px;
      top: -54px;
      border-radius: 999px;
      background: rgba(75, 163, 255, 0.22);
      filter: blur(16px);
    }

    .showcase-top {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      color: var(--soft);
      font-weight: 900;
    }

    .preview-stack {
      position: relative;
      display: grid;
      gap: 12px;
    }

    .preview-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      align-items: center;
      gap: 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 11px;
      background: rgba(0, 0, 0, 0.2);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .preview-row:hover {
      border-color: rgba(72, 234, 208, 0.42);
      background: rgba(255, 255, 255, 0.07);
    }

    .preview-row img {
      width: 64px;
      height: 48px;
      border-radius: 14px;
      object-fit: cover;
    }

    .preview-row strong,
    .preview-row small {
      display: block;
    }

    .preview-row small {
      margin-top: 3px;
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 6px 10px;
      color: #eaf4ff;
      background: rgba(75, 163, 255, 0.13);
      font-size: 0.78rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .section {
      padding: 62px 0 82px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .page-hero {
      padding: 74px 0 20px;
    }

    .page-hero h1 {
      margin-bottom: 12px;
      font-size: clamp(2.8rem, 7vw, 5.2rem);
    }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 26px 0 22px;
    }

    .search {
      display: grid;
      width: min(680px, 100%);
      gap: 9px;
      color: var(--muted);
      font-weight: 850;
    }

    .search input {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 18px;
      outline: none;
      padding: 0 17px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.075);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .search input::placeholder { color: rgba(168, 181, 216, 0.7); }

    .search input:focus {
      border-color: rgba(75, 163, 255, 0.78);
      background: rgba(255, 255, 255, 0.095);
      box-shadow: 0 0 0 4px rgba(75, 163, 255, 0.14);
    }

    .count {
      color: var(--muted);
      font-weight: 850;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .card, .social-card, .empty {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 20px 62px rgba(0, 0, 0, 0.26);
    }

    .card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 34%);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .card:hover {
      border-color: rgba(75, 163, 255, 0.52);
      background: var(--panel-strong);
    }

    .card:hover::after { opacity: 1; }

    .card img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background:
        linear-gradient(135deg, rgba(75, 163, 255, 0.28), rgba(155, 92, 255, 0.28)),
        #111a34;
    }

    .card-body {
      padding: 18px;
    }

    .category {
      color: var(--cyan);
      font-size: 0.74rem;
      font-weight: 950;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card h3 {
      margin: 8px 0;
      font-size: 1.1rem;
      letter-spacing: -0.025em;
    }

    .card p, .detail-copy {
      color: var(--muted);
      line-height: 1.62;
    }

    .card p {
      min-height: 76px;
      margin-bottom: 14px;
    }

    .meta {
      margin-bottom: 13px;
      color: #cfdbf7;
      font-size: 0.86rem;
      font-weight: 800;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(320px, 1fr);
      gap: 34px;
      align-items: start;
      padding: 68px 0 82px;
    }

    .detail-image {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 28px;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      box-shadow: var(--shadow);
    }

    .detail h1 {
      font-size: clamp(2.5rem, 6vw, 5.1rem);
    }

    .detail-card {
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 26px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .social-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 23px;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .social-card:hover {
      border-color: rgba(155, 92, 255, 0.56);
      background: var(--panel-strong);
    }

    .social-icon {
      display: grid;
      flex: 0 0 auto;
      width: 50px;
      height: 50px;
      place-items: center;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .social-icon img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .social-card strong,
    .social-card small {
      display: block;
    }

    .social-card small {
      margin-top: 4px;
      color: var(--muted);
    }

    .empty {
      padding: 36px;
      text-align: center;
    }

    .footer {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      border-top: 1px solid var(--line);
      padding: 30px 0 40px;
      color: var(--muted);
      text-align: center;
      font-weight: 750;
    }


    .hero.compact-home {
      min-height: calc(100vh - 74px);
      grid-template-columns: minmax(0, 0.92fr) minmax(320px, 1fr);
    }

    .hero-card {
      position: relative;
      border: 1px solid var(--line-strong);
      border-radius: 32px;
      padding: clamp(26px, 4vw, 42px);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.13), rgba(255,255,255,0.045)),
        rgba(11, 16, 34, 0.72);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      background:
        radial-gradient(circle at 18% 18%, rgba(75, 163, 255, 0.32), transparent 17rem),
        radial-gradient(circle at 90% 18%, rgba(155, 92, 255, 0.3), transparent 16rem),
        radial-gradient(circle at 48% 92%, rgba(72, 234, 208, 0.18), transparent 18rem);
      pointer-events: none;
    }

    .hero-card > * {
      position: relative;
    }

    .home-logo {
      display: grid;
      width: clamp(96px, 16vw, 148px);
      height: clamp(96px, 16vw, 148px);
      place-items: center;
      margin-bottom: 24px;
      border-radius: 34px;
      background: linear-gradient(135deg, var(--blue), var(--purple) 55%, var(--pink));
      box-shadow:
        0 24px 70px rgba(75, 163, 255, 0.32),
        inset 0 1px 0 rgba(255,255,255,0.28);
      font-size: clamp(3rem, 8vw, 5.4rem);
      font-weight: 950;
      letter-spacing: -0.08em;
    }

    .home-title {
      margin-bottom: 12px;
      font-size: clamp(3.3rem, 10vw, 7.6rem);
      line-height: 0.88;
      letter-spacing: -0.09em;
      background: linear-gradient(90deg, #fff, #dce7ff 36%, #7ddcff 70%, #d8c8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .home-subtitle {
      max-width: 620px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .home-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .home-chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 7px 12px;
      background: rgba(255,255,255,0.07);
      color: #eaf4ff;
      font-size: 0.82rem;
      font-weight: 850;
    }

    .home-feature-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 26px;
    }

    .home-feature {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      background: rgba(0,0,0,0.18);
    }

    .home-feature strong {
      display: block;
      margin-bottom: 5px;
      font-size: 0.98rem;
    }

    .home-feature span {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .showcase.featured-panel {
      padding: 0;
    }

    .featured-panel-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 20px 20px 0;
      margin-bottom: 16px;
      color: var(--soft);
      font-weight: 900;
    }

    .big-preview {
      position: relative;
      display: block;
      margin: 0 20px 16px;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(0,0,0,0.22);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .big-preview:hover {
      transform: translateY(-3px);
      border-color: rgba(72, 234, 208, 0.42);
    }

    .big-preview img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
    }

    .big-preview-info {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 14px;
      background: rgba(5, 7, 17, 0.72);
      backdrop-filter: blur(14px);
    }

    .big-preview-info strong,
    .big-preview-info small {
      display: block;
    }

    .big-preview-info small {
      margin-top: 4px;
      color: var(--muted);
      font-weight: 750;
    }

    .featured-panel .preview-stack {
      padding: 0 20px 20px;
    }

    .section.featured-section {
      padding-top: 10px;
    }

    @media (max-width: 700px) {
      .hero.compact-home {
        grid-template-columns: 1fr;
      }

      .home-feature-strip {
        grid-template-columns: 1fr;
      }

      .home-logo {
        border-radius: 28px;
      }
    }



    .filter-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-button.active {
      border-color: rgba(72, 234, 208, 0.62);
      background: rgba(72, 234, 208, 0.14);
      color: var(--text);
    }

    @media (max-width: 700px) {
      .filter-actions {
        justify-content: flex-start;
      }
    }




    /* Keep the filter button close to the search bar */
    .toolbar {
      justify-content: flex-start;
      align-items: end;
      gap: 14px;
    }

    .search {
      flex: 0 1 680px;
    }

    .filter-actions {
      justify-content: flex-start;
      align-items: end;
      gap: 10px;
      margin-bottom: 0;
    }

    .filter-actions .count {
      display: none;
    }

    @media (max-width: 760px) {
      .toolbar {
        align-items: stretch;
      }

      .search {
        flex: 1 1 auto;
      }

      .filter-actions {
        margin-top: -4px;
      }
    }

    /* Reference-like script cards */
    .grid {
      gap: 20px;
    }

    .card {
      border: 0;
      border-radius: 18px;
      background: #162440;
      box-shadow: none;
      overflow: hidden;
      transform: none;
    }

    .card:hover {
      transform: translateY(-3px);
      background: #1a2a49;
      border-color: transparent;
    }

    .card::after {
      display: none;
    }

    .card-media {
      position: relative;
      overflow: hidden;
      border-radius: 18px 18px 0 0;
    }

    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(75, 163, 255, 0.3), rgba(155, 92, 255, 0.3));
    }

    const $ = (selector) => document.querySelector(selector);

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatRelativeTime(dateValue) {
      const date = dateValue instanceof Date ? dateValue : new Date(dateValue);
      if (Number.isNaN(date.getTime())) return "";

      const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
      const minute = 60;
      const hour = minute * 60;
      const day = hour * 24;
      const week = day * 7;
      const month = day * 30;
      const year = day * 365;

      if (seconds < 10) return "just now";
      if (seconds < minute) return `${seconds} seconds ago`;

      const minutes = Math.floor(seconds / minute);
      if (minutes === 1) return "1 minute ago";
      if (minutes < 60) return `${minutes} minutes ago`;

      const hours = Math.floor(seconds / hour);
      if (hours === 1) return "1 hour ago";
      if (hours < 24) return `${hours} hours ago`;

      const days = Math.floor(seconds / day);
      if (days === 1) return "1 day ago";
      if (days < 7) return `${days} days ago`;

      const weeks = Math.floor(seconds / week);
      if (weeks === 1) return "1 week ago";
      if (weeks < 5) return `${weeks} weeks ago`;

      const months = Math.floor(seconds / month);
      if (months === 1) return "1 month ago";
      if (months < 12) return `${months} months ago`;

      const years = Math.floor(seconds / year);
      return years === 1 ? "1 year ago" : `${years} years ago`;
    }

    function getAddedDate(item) {
      if (item.addedAt) return item.addedAt;
      const minutes = Number(item.addedMinutesAgo || 0);
      return new Date(Date.now() - minutes * 60 * 1000);
    }

    function formatRelativeTime(dateValue) {
      const date = dateValue instanceof Date ? dateValue : new Date(dateValue);
      if (Number.isNaN(date.getTime())) return "just now";

      const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
      const minute = 60;

      const week = day * 7;
      const month = day * 30;

      if (seconds < 10) return "just now";

      if (months < 12) return `${months} months ago`;

      const years = Math.floor(seconds / year);
      return years === 1 ? "1 year ago" : `${years} years ago`;
    }

    function getAddedDate(item) {
      if (item && item.addedAt) return item.addedAt;

      const minutes = Number((item && item.addedMinutesAgo) || 0);
      return new Date(Date.now() - minutes * 60 * 1000);
    }

    function formatAddedAgo(itemOrMinutes) {
      if (typeof itemOrMinutes === "object") {
        return formatRelativeTime(getAddedDate(itemOrMinutes));
      }

      const minutes = Number(itemOrMinutes || 0);
      return formatRelativeTime(new Date(Date.now() - minutes * 60 * 1000));
    }

    function formatViews(value) {
      const number = Number(value || 0);
      if (number >= 1000) {
        const short = (number / 1000).toFixed(number % 1000 === 0 ? 0 : 1);
        return `${short}k`;
      }
      return `${number}`;
    }


    function sortNewestFirst(list) {
      return [...list].sort((a, b) => Number(a.addedMinutesAgo || 0) - Number(b.addedMinutesAgo || 0));
    }

    function tagHtml(tags) {
      return tags.map((tag) => `<span class="pill">${escapeHtml(tag)}</span>`).join("");
    }

    function scriptUrl(id) {
      return `#script/${encodeURIComponent(id)}`;
    }

    function cardHtml(item) {
      const status = item.keySystem || "Key System";
      const isNoKey = status.toLowerCase().includes("no key");

      return `
        <a class="card" href="${scriptUrl(item.id)}">
          <div class="card-media">
            <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)} thumbnail" loading="lazy">
            <span class="card-badge dark time">${escapeHtml(formatAddedAgo(item))}</span>
            <span class="card-badge status ${isNoKey ? "no-key" : "key"}">${escapeHtml(status)}</span>
          </div>
          <div class="card-body">
            <span class="card-game">${escapeHtml(item.game)}</span>
            <h3>${escapeHtml(item.title)}</h3>
          </div>
        </a>
      `;
    }

    function renderCards(container, items) {
      if (container) container.innerHTML = sortNewestFirst(items).map(cardHtml).join("");
    }

    function renderHome() {
      const newest = sortNewestFirst(scripts);

      const total = $("[data-total-scripts]");
      if (total) total.textContent = `${scripts.length} scripts`;

      renderCards($("[data-featured-grid]"), newest.slice(0, 4));

      const previewList = $("[data-preview-list]");
      if (previewList) {
        previewList.innerHTML = newest.slice(0, 4).map((item) => `
          <a class="preview-row" href="${scriptUrl(item.id)}">
            <img src="${escapeHtml(item.image)}" alt="" loading="lazy">
            <span>
              <strong>${escapeHtml(item.title)}</strong>
              <small>${escapeHtml(item.game)} · Added ${formatAddedAgo(item)}</small>
            </span>
            <span class="pill">${escapeHtml(item.keySystem || item.tags[0])}</span>
          </a>
        `).join("");
      }
    }

    let noKeyOnly = false;

    function filterScripts() {
      const input = $("#script-search");
      const term = input ? input.value.trim().toLowerCase() : "";

      const filtered = scripts.filter((item) => {
        const isNoKey = String(item.keySystem || "").toLowerCase().includes("no key");
        const text = [
          item.title,
          item.game,
          item.description,
          item.keySystem,
          formatAddedAgo(item),
          ...(item.tags || [])
        ].join(" ").toLowerCase();

        return text.includes(term) && (!noKeyOnly || isNoKey);
      });

      const sorted = sortNewestFirst(filtered);
      renderCards($("[data-scripts-grid]"), sorted);

      const resultCount = $("[data-result-count]");
      if (resultCount) resultCount.textContent = `${sorted.length} of ${scripts.length} scripts`;

      const empty = $("[data-empty]");
      if (empty) empty.hidden = sorted.length > 0;

      const button = $("[data-no-key-filter]");
      if (button) {
        button.classList.toggle("active", noKeyOnly);
        button.textContent = noKeyOnly ? "Showing No Key System" : "No Key System";
      }
    }


    let selectedExecutorPlatform = "";


    function platformIconSvg(icon) {
      const key = String(icon || "").toLowerCase();

      if (key.includes("android")) {
        return `<i class="fa-brands fa-android" aria-hidden="true"></i>`;
      }

      if (key.includes("ios") || key.includes("apple")) {
        return `<i class="fa-brands fa-apple" aria-hidden="true"></i>`;
      }

      if (key.includes("windows")) {
        return `<i class="fa-brands fa-windows" aria-hidden="true"></i>`;
      }

      return `<i class="fa-solid fa-microchip" aria-hidden="true"></i>`;
    }

    function executorLogoSvg(text) {
      const label = String(text || "?").slice(0, 1).toUpperCase();
      return `<i class="fa-solid fa-bolt" aria-hidden="true"></i><span class="sr-only">${escapeHtml(label)}</span>`;
    }

    function globeSvg() {
      return `<i class="fa-solid fa-globe" aria-hidden="true"></i>`;
    }

    function discordSvg() {
      return `<i class="fa-brands fa-discord" aria-hidden="true"></i>`;
    }

    function platformCardHtml(item) {
      const iconClass = item.icon === "windows" ? "platform-icon windows" : "platform-icon";

      return `
        <button class="platform-card ${selectedExecutorPlatform === item.id ? "active" : ""}" type="button" data-platform-filter="${escapeHtml(item.id)}">
          <span class="${iconClass}">${platformIconSvg(item.icon)}</span>
          <span class="platform-info">
            <h3>${escapeHtml(item.label)}</h3>
          </span>
        </button>
      `;
    }

    function executorIconHtml(item) {
      if (item.image) {
        return `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)} icon" loading="lazy">`;
      }

      return executorLogoSvg(item.iconText || item.name);
    }

    function executorCardHtml(item) {
      return `
        <article class="executor-card">
          <div class="executor-card-icon">${executorIconHtml(item)}</div>
          <div class="executor-card-content">
            <div class="executor-card-title-row">
              <span class="executor-card-title">${escapeHtml(item.name)}</span>
              <span class="executor-card-badge">${escapeHtml(item.price)}</span>
            </div>
            <div class="executor-card-meta">
              <div>Platform: ${escapeHtml(item.platform)}</div>
            </div>
          </div>
          <div class="executor-card-actions">
            <a class="executor-card-icon-button" href="${escapeHtml(item.websiteUrl || "#")}" target="_blank" rel="noopener" aria-label="${escapeHtml(item.name)} website">${globeSvg()}</a>
            <a class="executor-card-icon-button" href="${escapeHtml(item.discordUrl || "#")}" target="_blank" rel="noopener" aria-label="${escapeHtml(item.name)} Discord">${discordSvg()}</a>
          </div>
        </article>
      `;
    }

    function renderExecutorPage() {
      const platformGrid = $("[data-platform-grid]");
      const cardsGrid = $("[data-executor-cards]");
      const label = $("[data-executor-platform-label]");

      if (!platformGrid || !cardsGrid || !label) return;

      platformGrid.innerHTML = executorPlatforms.map(platformCardHtml).join("");
      label.textContent = selectedExecutorPlatform || "All";

      const filtered = selectedExecutorPlatform
        ? executors.filter((item) => item.platform === selectedExecutorPlatform)
        : executors;

      if (!filtered.length) {
        cardsGrid.innerHTML = `<div class="executor-empty">No executors found for this platform.</div>`;
      } else {
        cardsGrid.innerHTML = filtered.map(executorCardHtml).join("");
      }

      $$("[data-platform-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          const platform = button.dataset.platformFilter || "";
          selectedExecutorPlatform = selectedExecutorPlatform === platform ? "" : platform;
          renderExecutorPage();
        });
      });
    }


    function socialIconClass(name) {
      const key = String(name || "").toLowerCase();
      if (key.includes("discord")) return "fa-brands fa-discord";
      if (key.includes("youtube")) return "fa-brands fa-youtube";
      if (key.includes("tiktok")) return "fa-brands fa-tiktok";
      return "fa-solid fa-link";
    }

    function socialClass(name) {
      return String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-");
    }

    function renderSocials() {
      $("[data-social-grid]").innerHTML = socials.map((social) => `
        <a class="social-card ${escapeHtml(socialClass(social.name))}" href="${escapeHtml(social.url)}" target="_blank" rel="noopener">
          <span class="social-icon"><i class="${escapeHtml(socialIconClass(social.name))}" aria-hidden="true"></i></span>
          <span>
            <strong>${escapeHtml(social.name)}</strong>
            <small>${escapeHtml(social.label)}</small>
          </span>
        </a>
      `).join("");
    }


    function copyToClipboard(value) {
      const text = String(value || "").trim();
      if (!text || text === "#") return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          alert("Game link copied. Paste it into a new browser tab to open Roblox.");
        }).catch(() => {
          prompt("Copy this game link:", text);
        });
      } else {
        prompt("Copy this game link:", text);
      }
    }

    function renderDetail(id) {
      const item = scripts.find((scriptItem) => scriptItem.id === id);
      const detailView = $("#detail-view");

      if (!item) {
        detailView.innerHTML = `
          <div class="section">
            <div class="empty">
              <h1>Script not found</h1>
              <p>The id in the URL does not match a script in the array.</p>
              <a class="button primary" href="#scripts">Back to Scripts</a>
            </div>
          </div>
        `;
        document.title = "Script Not Found | jscripts";
        return;
      }

      document.title = `${item.title} | jscripts`;
      detailView.innerHTML = `
        <article class="detail">
          <img class="detail-image" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)} thumbnail">
          <div class="detail-card">
            <p class="eyebrow">${escapeHtml(item.game)}</p>
            <h1>${escapeHtml(item.title)}</h1>
            <p class="detail-copy">${escapeHtml(item.description)}</p>
            <div class="meta">Added ${formatAddedAgo(item)}</div>
            <div class="tags">${tagHtml([...(item.tags || []), item.keySystem].filter(Boolean))}</div>
            <div class="actions">
              <a class="button primary full" href="${escapeHtml(item.getScriptUrl)}" target="_blank" rel="noopener">Get Script</a>
              <button class="button full ghost" type="button" onclick="copyToClipboard('${escapeHtml(item.gameUrl || '')}')">Open Game Page</button>
              <p class="game-link-note">Roblox may block opening inside previews, so this button copies the link instead.</p>
              <a class="button full ghost" href="#scripts">Back to Scripts</a>
            </div>
          </div>
        </article>
      `;
    }

    function setActiveView(route) {
      const [page, rawId] = route.replace(/^#/, "").split("/");
      const viewName = page || "scripts";

      $$(".view").forEach((view) => view.classList.remove("active"));
      $$(".nav-link").forEach((link) => link.classList.toggle("active", link.dataset.route === viewName));

      if (viewName === "script") {
        $("#detail-view").classList.add("active");
        renderDetail(decodeURIComponent(rawId || ""));
      } else {
        const target = $(`[data-view="${viewName}"]`) || $('[data-view="scripts"]');
        target.classList.add("active");
        document.title = `${viewName.charAt(0).toUpperCase() + viewName.slice(1)} | jscripts`;
      }

      $("[data-nav-links]").classList.remove("open");
      $("[data-menu-button]").setAttribute("aria-expanded", "false");
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function init() {
      renderHome();
      renderCards($("[data-scripts-grid]"), scripts);
      renderSocials();
      renderExecutorPage();
      filterScripts();


      $("#script-search").addEventListener("input", filterScripts);
      $("[data-no-key-filter]").addEventListener("click", () => {
        noKeyOnly = !noKeyOnly;
        filterScripts();
      });
      $("[data-menu-button]").addEventListener("click", () => {
        const links = $("[data-nav-links]");
        const open = links.classList.toggle("open");
        $("[data-menu-button]").setAttribute("aria-expanded", String(open));
      });

      window.addEventListener("hashchange", () => setActiveView(location.hash || "#scripts"));
      setInterval(() => {
        renderHome();
        filterScripts();
        renderExecutorPage();
        if ((location.hash || "#scripts").startsWith("#script/")) {
          const id = decodeURIComponent((location.hash || "").split("/")[1] || "");
          renderDetail(id);
        }
      }, 15000);

      setActiveView(location.hash || "#scripts");
    }

    init();
  </script>
